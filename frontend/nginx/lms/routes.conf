# =============================================================================
#  Routing table: public URL prefix  ->  microservice
#  Included by BOTH server-http.conf.template and server-https.conf.template.
#
#  Rules that keep this robust:
#   * `proxy_pass $variable` + `resolver` => the backend name is resolved at REQUEST time.
#     nginx therefore starts even if a backend is down/restarting, and never keeps a stale IP
#     after a container is recreated.  (A literal `proxy_pass http://svc:8000;` is resolved once
#     at startup: one missing container = nginx refuses to boot, one restart = permanent 502.)
#   * `proxy_pass $variable;` (no URI part) forwards the request path and query string untouched.
#   * Every prefix is matched as ^/prefix(/|$) so BOTH "/modules" and "/modules/..." reach the
#     API. Nothing under an API prefix is ever answered with the React index.html.
# =============================================================================

resolver 127.0.0.11 valid=10s ipv6=off;   # Docker's embedded DNS
resolver_timeout 5s;

set $auth_svc         http://auth_service:8000;
set $course_svc       http://course_service:8000;
set $module_svc       http://module_lesson_service:8000;
set $assessment_svc   http://assessment_service:8000;
set $progress_svc     http://progress_service:8000;
set $grading_svc      http://marking_grading_service:8000;
set $scheduling_svc   http://scheduling_service:8000;
set $notification_svc http://notification_service:8000;

# ---- Trailing slash normalisation -----------------------------------------------------------
# "/assignments/" -> "/assignments". FastAPI answers a URL that differs from its route only by a
# trailing slash with a 307 redirect, which is slow, breaks CORS pre-flights and can leak the wrong
# scheme/host. Stripping the slash here means an API URL works with or without it, with no redirect.
rewrite ^(/(?:auth|api/courses|modules|progress|assignments|assessments|questions|grading|sessions|notifications)(?:/.*[^/])?)/+$ $1 last;

# ---- nginx-level health check (used by Docker / AWS load balancer target groups)
location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# ---- Let's Encrypt HTTP-01 challenge (certbot --webroot -w /var/www/certbot)
location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
}

# ---- API: authentication service ------------------------------------------------
location ~ ^/auth(/|$) {
    set $upstream $auth_svc;
    include /etc/nginx/lms/proxy.conf;
    proxy_pass $upstream;
}

# ---- API: course service  (its routes live under /api/courses) ------------------
location ^~ /api/courses {
    set $upstream $course_svc;
    include /etc/nginx/lms/proxy.conf;
    proxy_pass $upstream;
}

# ---- API: module + lesson service ------------------------------------------------
location ~ ^/modules(/|$) {
    set $upstream $module_svc;
    include /etc/nginx/lms/proxy.conf;
    proxy_pass $upstream;
}

# ---- API: progress service --------------------------------------------------------
location ~ ^/progress(/|$) {
    set $upstream $progress_svc;
    include /etc/nginx/lms/proxy.conf;
    proxy_pass $upstream;
}

# ---- API: assessment service (assignments, assessments/exams, questions) ---------
location ~ ^/(assignments|assessments|questions)(/|$) {
    set $upstream $assessment_svc;
    include /etc/nginx/lms/proxy.conf;
    proxy_pass $upstream;
}

# ---- API: marking & grading service ----------------------------------------------
location ~ ^/grading(/|$) {
    set $upstream $grading_svc;
    include /etc/nginx/lms/proxy.conf;
    proxy_pass $upstream;
}

# ---- API: scheduling / live sessions ---------------------------------------------
location ~ ^/sessions(/|$) {
    set $upstream $scheduling_svc;
    include /etc/nginx/lms/proxy.conf;
    proxy_pass $upstream;
}

# ---- API: notifications ------------------------------------------------------------
# (/internal/notifications/* is service-to-service only and is deliberately NOT routed here)
location ~ ^/notifications(/|$) {
    set $upstream $notification_svc;
    include /etc/nginx/lms/proxy.conf;
    proxy_pass $upstream;
}

# ---- Uploaded files ------------------------------------------------------------------
# Two services both publish "/uploads/...":
#   assessment service  -> /uploads/{assignments,submissions,questions,uploadAnswers}/... and /static/questions/...
#   module service      -> /uploads/<lesson media>            (everything else under /uploads/)
# `^~` prefixes: the longest one wins and regex locations are not consulted afterwards.
location ^~ /uploads/assignments/   { set $upstream $assessment_svc; include /etc/nginx/lms/proxy.conf; proxy_pass $upstream; }
location ^~ /uploads/submissions/   { set $upstream $assessment_svc; include /etc/nginx/lms/proxy.conf; proxy_pass $upstream; }
location ^~ /uploads/questions/     { set $upstream $assessment_svc; include /etc/nginx/lms/proxy.conf; proxy_pass $upstream; }
location ^~ /uploads/uploadAnswers/ { set $upstream $assessment_svc; include /etc/nginx/lms/proxy.conf; proxy_pass $upstream; }
location ^~ /static/questions/      { set $upstream $assessment_svc; include /etc/nginx/lms/proxy.conf; proxy_pass $upstream; }
location ^~ /uploads/               { set $upstream $module_svc;     include /etc/nginx/lms/proxy.conf; proxy_pass $upstream; }

# ---- Service-to-service endpoints must never be reachable from the internet ------------------
location ^~ /internal/ {
    default_type application/json;
    return 404 '{"detail":"Not Found"}';
}

# ---- Any other /api/* URL: a real JSON 404, never the React page ----------------------
location ^~ /api/ {
    default_type application/json;
    return 404 '{"detail":"Not Found"}';
}

# ---- A backend that is down / restarting: JSON the frontend can display ----------------
location @svc_unavailable {
    default_type application/json;
    return 503 '{"detail":"Service temporarily unavailable. Please try again in a moment."}';
}

# ---- React single-page app -----------------------------------------------------------------
# Hashed build assets: cache for a year. A missing asset must be a 404, NOT index.html
# (otherwise a browser holding a stale page gets HTML where it expected JavaScript).
location ^~ /assets/ {
    expires 1y;
    try_files $uri =404;
}

# index.html must never be cached, otherwise users keep loading an old build after a deploy.
location = /index.html {
    expires -1;
}

# Favicons: browsers cache these in a separate, extremely sticky cache keyed to the exact URL,
# ignoring normal reloads. Keep this short so a future icon change doesn't get stuck again -
# and when you DO change the icon, add a new filename (e.g. favicon-v3.ico) rather than
# overwriting the old one, so browsers that already cached the old URL aren't affected.
location ~* \.(ico|png)$ {
    expires 1h;
    try_files $uri =404;
}

# Everything else is a client-side (React Router) route: /login, /student/courses, ...
location / {
    try_files $uri $uri/ /index.html;
}
