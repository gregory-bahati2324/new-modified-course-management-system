# http{}-level helpers (this file is included from conf.d/, which nginx loads inside http{}).

# Scheme the *browser* used. Behind an AWS ALB / CloudFront this container only sees plain http,
# so trust the X-Forwarded-Proto they set; otherwise use the scheme of this connection.
map $http_x_forwarded_proto $lms_proto {
    default $scheme;
    https   https;
    http    http;
}

# Host (including port) the browser used. $host drops the port and lower-cases; $http_host keeps it.
map $http_host $lms_host {
    default $http_host;
    ""      $host;
}

# gzip for text assets and JSON
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;
