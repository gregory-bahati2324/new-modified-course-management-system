# =============================================================================
#  PRODUCTION stack (AWS EC2 / any Docker host)
#
#    cp .env.example .env      # fill in the secrets  (or run ./scripts/deploy.sh which does it)
#    docker compose up -d --build
#
#  Only the `frontend` container (nginx) publishes ports. It serves the React app and reverse
#  proxies every API call to the right microservice over the private compose network, so the
#  databases and the 8 APIs are NOT reachable from the internet.
#
#  Local development uses docker-compose.dev.yml instead.
#
#  NOTE: no top-level `name:` is set on purpose. Compose derives the project name from this folder,
#  which keeps re-using the existing "<folder>_postgres_data" volume (your database) on the server.
# =============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"     # stop container logs from slowly filling the EC2 disk
    max-file: "5"

# Environment shared by every backend service ---------------------------------
x-service-env: &service-env
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required - copy .env.example to .env and set it}
  JWT_ALGORITHM: HS256
  NOTIFICATION_SERVICE_URL: http://notification_service:8000
  NOTIFICATION_INTERNAL_API_KEY: ${NOTIFICATION_INTERNAL_API_KEY:?NOTIFICATION_INTERNAL_API_KEY is required - see .env.example}
  CORS_ORIGINS: ${CORS_ORIGINS:-*}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}

# Postgres connection pieces ---------------------------------------------------
x-db: &db
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - see .env.example}

services:

  # ---------------------------------------------------------------------------
  #  Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15
    container_name: auth_postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *db
      POSTGRES_DB: auth_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # no `ports:` -> Postgres is only reachable from other containers
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot job: makes sure every service database exists. Idempotent, so it also repairs an
  # older postgres volume that was created before some of the databases were added.
  db_init:
    image: postgres:15
    container_name: lms_db_init
    restart: "no"
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - see .env.example}
    volumes:
      - ./postgres-init/create-databases.sh:/create-databases.sh:ro
    entrypoint: ["sh", "/create-databases.sh"]

  # ---------------------------------------------------------------------------
  #  Backend services  (internal only - reached through nginx)
  # ---------------------------------------------------------------------------
  auth_service:
    build: ./backend
    container_name: auth_service
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db_init:
        condition: service_completed_successfully
    environment:
      <<: *service-env
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/auth_db

  course_service:
    build: ./backend/createCourse
    container_name: course_service
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db_init:
        condition: service_completed_successfully
    environment:
      <<: *service-env
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/course_db

  module_lesson_service:
    build: ./backend/module_lesson
    container_name: module_lesson_service
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db_init:
        condition: service_completed_successfully
    environment:
      <<: *service-env
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/module_db
      COURSE_SERVICE_URL: http://course_service:8000
    volumes:
      # lesson media (images / video / pdf). Same host folder as before, so existing files survive.
      - ./backend/module_lesson/uploads:/app/uploads

  assessment_service:
    build: ./backend/assessments
    container_name: assessment_service
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db_init:
        condition: service_completed_successfully
    environment:
      <<: *service-env
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/assessment_db
      COURSE_SERVICE_URL: http://course_service:8000
      GRADING_SERVICE_URL: http://marking_grading_service:8000
    volumes:
      # assignment / submission / question / answer files
      - ./backend/assessments/uploads:/app/uploads

  progress_service:
    build: ./backend/progress_service
    container_name: progress_service
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db_init:
        condition: service_completed_successfully
    environment:
      <<: *service-env
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/progress_db
      MODULE_SERVICE_BASE_URL: http://module_lesson_service:8000

  marking_grading_service:
    build: ./backend/marking_grading
    container_name: marking_grading_service
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db_init:
        condition: service_completed_successfully
    environment:
      <<: *service-env
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/marking_db
      AUTHENTICATION_SERVICE_URL: http://auth_service:8000

  scheduling_service:
    build: ./backend/scheduling_service
    container_name: scheduling_service
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db_init:
        condition: service_completed_successfully
    environment:
      <<: *service-env
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/scheduling_db
      COURSE_SERVICE_URL: http://course_service:8000

  notification_service:
    build: ./backend/notification_service
    container_name: notification_service
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db_init:
        condition: service_completed_successfully
    environment:
      <<: *service-env
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/notification_db

  # ---------------------------------------------------------------------------
  #  Frontend + reverse proxy  (the ONLY container that publishes ports)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
    container_name: lms_frontend
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - auth_service
      - course_service
      - module_lesson_service
      - assessment_service
      - progress_service
      - marking_grading_service
      - scheduling_service
      - notification_service
    environment:
      # Domain name of the site. If /etc/letsencrypt/live/<SERVER_NAME>/ exists nginx switches to
      # HTTPS automatically, otherwise it serves plain HTTP (see DEPLOYMENT.md).
      SERVER_NAME: ${SERVER_NAME:-_}
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-200m}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro     # certificates issued by certbot on the host
      - ./certbot-www:/var/www/certbot           # ACME HTTP-01 challenge files

volumes:
  postgres_data:
